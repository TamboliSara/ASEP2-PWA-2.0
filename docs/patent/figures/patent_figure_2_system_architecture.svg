    <!-- Command Engine 228 -->
    <g transform="translate(740, 35)">
      <rect x="0" y="0" width="220" height="135" class="box" />
      <text x="205" y="-4" class="ref-num">228</text>
      <text x="110" y="25" class="text-title">COMMAND ENGINE</text>
