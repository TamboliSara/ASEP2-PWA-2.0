      <text x="130" y="100" class="text-sub">• Quality Index History</text>
    </g>

    <path d="M 300 92 L 360 92" class="line-arrow" />
    <path d="M 620 92 L 680 92" class="line-arrow" />
  </g>

  <!-- LAYER CONNECTOR 3 -> 4 -->
  <path d="M 490 565 L 490 595" class="line-arrow" />

