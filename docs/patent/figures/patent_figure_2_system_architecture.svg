<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <style>
    .patent-title { font-size: 18px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .layer-box { fill: #ffffff; stroke: #000000; stroke-width: 2; stroke-dasharray: 4,3; }
    .box { fill: #ffffff; stroke: #000000; stroke-width: 1.8; }
    .inner-box { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
    .text-title { font-size: 13px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .text-sub { font-size: 11px; fill: #000000; text-anchor: middle; }
    .line { stroke: #000000; stroke-width: 1.5; fill: none; }
    .line-arrow { stroke: #000000; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .ref-num { font-size: 12px; font-weight: bold; fill: #000000; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="30" class="patent-title">FIG. 2</text>
  <text x="550" y="52" class="text-sub" font-style="italic">FOUR-LAYER SYSTEM ARCHITECTURE FOR AUTONOMOUS FOOD QUALITY &amp; BIOMETRIC ACCOUNTABILITY</text>

  <!-- SYSTEM ARCHITECTURE CONTAINER 200 -->
  <text x="50" y="80" class="ref-num">200</text>

  <!-- LAYER 1: HARDWARE NODE LAYER (202) -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="980" height="155" class="layer-box" />
    <text x="965" y="-6" class="ref-num">202</text>
    <text x="15" y="22" class="text-title" text-anchor="start">LAYER 1: HARDWARE NODE LAYER (EMBEDDED LOCAL EDGE)</text>

    <!-- Components in Layer 1 -->
    <g transform="translate(30, 35)">
      <rect x="0" y="0" width="180" height="95" class="box" />
      <text x="165" y="-4" class="ref-num">104-108</text>
      <text x="90" y="25" class="text-title">SENSOR ARRAY</text>
      <text x="90" y="45" class="text-sub">• Bosch BME688 (VOC/RH)</text>
      <text x="90" y="62" class="text-sub">• DS18B20 Temp</text>
      <text x="90" y="79" class="text-sub">• HC-SR04 Occupancy</text>
    </g>

    <g transform="translate(260, 35)">
      <rect x="0" y="0" width="220" height="95" class="box" />
      <text x="205" y="-4" class="ref-num">102</text>
      <text x="110" y="25" class="text-title">ESP32-S3 MCU</text>
      <text x="110" y="45" class="text-sub">Dual-Core 240MHz</text>
      <text x="110" y="65" class="text-sub">INT8 TinyML Engine (210)</text>
      <text x="110" y="82" class="text-sub">&lt;50ms Spoilage Classifier</text>
    </g>

    <g transform="translate(530, 35)">
      <rect x="0" y="0" width="200" height="95" class="box" stroke-width="2" />
      <text x="185" y="-4" class="ref-num">114</text>
      <text x="100" y="25" class="text-title">spoilLocked FLAG</text>
      <text x="100" y="45" class="text-sub">Firmware Hardware</text>
      <text x="100" y="62" class="text-sub">Interlock Mechanism</text>
      <text x="100" y="80" class="text-sub" font-size="10" font-style="italic">(Overrides Cloud Unlock)</text>
    </g>

    <g transform="translate(760, 35)">
      <rect x="0" y="0" width="190" height="95" class="box" />
      <text x="175" y="-4" class="ref-num">112</text>
      <text x="95" y="25" class="text-title">SOLENOID ACTUATOR</text>
      <text x="95" y="45" class="text-sub">12V Fail-Secure Lock</text>
      <text x="95" y="65" class="text-sub">NPN Transistor Driver (110)</text>
      <text x="95" y="82" class="text-sub">Chamber Latch</text>
    </g>

