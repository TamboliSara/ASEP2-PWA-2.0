      <text x="465" y="-4" class="ref-num">212</text>
      <text x="240" y="20" class="text-title">IEEE 802.11 b/g/n Wi-Fi &amp; TLS 1.3 SECURE TRANSPORT LAYER</text>
      <text x="240" y="36" class="text-sub">Asynchronous MQTT / WebSockets &amp; Local Offline Buffer Protocol</text>
