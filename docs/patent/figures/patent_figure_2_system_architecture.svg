    <!-- Cloud Functions 218 -->
    <g transform="translate(360, 35)">
      <rect x="0" y="0" width="260" height="115" class="box" />
      <text x="245" y="-4" class="ref-num">218</text>
      <text x="130" y="25" class="text-title">CLOUD FUNCTIONS</text>
      <text x="130" y="45" class="text-sub">Serverless Logic Engine</text>
      <text x="130" y="65" class="text-sub">• Dynamic Hoarding Rules</text>
      <text x="130" y="83" class="text-sub">• Ghost Deposit Revocation</text>
