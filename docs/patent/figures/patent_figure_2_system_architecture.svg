  <g transform="translate(60, 595)">
    <rect x="0" y="0" width="980" height="190" class="layer-box" />
    <text x="965" y="-6" class="ref-num">208</text>
    <text x="15" y="22" class="text-title" text-anchor="start">LAYER 4: PROGRESSIVE WEB APPLICATION (PWA) OPERATIONAL ENGINES</text>

