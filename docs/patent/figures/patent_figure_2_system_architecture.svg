    <path d="M 480 82 L 530 82" class="line-arrow" />
    <path d="M 730 82 L 760 82" class="line-arrow" />
  </g>

  <!-- LAYER CONNECTOR 1 -> 2 -->
  <path d="M 370 250 L 370 280" class="line-arrow" />
  <text x="450" y="270" class="text-sub" font-weight="bold">Telemetric Real-Time Sensor Stream &amp; State Payload (HTTPS/REST)</text>

