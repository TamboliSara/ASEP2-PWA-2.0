      <text x="110" y="86" class="text-sub">• ADMIN_UNLOCK Protocol</text>
      <text x="110" y="104" class="text-sub">• Spoilage Audit Clearing</text>
      <text x="110" y="122" class="text-sub">• System Diagnostics</text>
