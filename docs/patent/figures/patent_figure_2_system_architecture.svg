      <text x="107" y="45" class="text-sub">Identity &amp; Device Reg.</text>
      <text x="107" y="68" class="text-sub">• WebAuthn / Token Pass</text>
      <text x="107" y="86" class="text-sub">• Device Fingerprinting</text>
      <text x="107" y="104" class="text-sub">• TLS Client Validation</text>
      <text x="107" y="122" class="text-sub">• Anti-Spoofing Rules</text>
    </g>

    <!-- Input Engine 224 -->
    <g transform="translate(260, 35)">
      <rect x="0" y="0" width="215" height="135" class="box" stroke-width="2" />
      <text x="200" y="-4" class="ref-num">224</text>
      <text x="107" y="25" class="text-title">INPUT ENGINE</text>
      <text x="107" y="45" class="text-sub">Biometric Consent Gate</text>
      <text x="107" y="68" class="text-sub">• In-Browser Landmark Neural</text>
      <text x="107" y="86" class="text-sub">• 128-D Vector Embedding</text>
      <text x="107" y="104" class="text-sub">• Liveness Check (4/5 frames)</text>
      <text x="107" y="122" class="text-sub">• Anti-Hoarding Gate</text>
    </g>

    <!-- Intelligence Engine 226 -->
    <g transform="translate(500, 35)">
      <rect x="0" y="0" width="215" height="135" class="box" />
      <text x="200" y="-4" class="ref-num">226</text>
      <text x="107" y="25" class="text-title">INTELLIGENCE ENGINE</text>
      <text x="107" y="45" class="text-sub">Dashboard &amp; Quality Index</text>
      <text x="107" y="68" class="text-sub">• Real-Time QI Display</text>
      <text x="107" y="86" class="text-sub">• Remaining Shelf-Life (Days)</text>
      <text x="107" y="104" class="text-sub">• Predictive Spoilage Curves</text>
      <text x="107" y="122" class="text-sub">• Community Allocation Map</text>
